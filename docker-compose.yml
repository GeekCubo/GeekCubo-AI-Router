services:
  api:
    build: .
    image: geekcubo
    container_name: geekcubo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8000"
    env_file:
      - .env
    volumes:
      - geekcubo-data:/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/geekcubo.db
      - PORT=8000
      - HOST=0.0.0.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional SearXNG instance for native-Chat web search. Enabled ONLY when the
  # operator runs `docker compose --profile search up -d`. GeekCubo never
  # depends on it; a failed health check does not stop the api service.
  searxng:
    profiles: ["search"]
    image: searxng/searxng:2026.11.5-3e95f6cd2
    container_name: geekcubo-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    volumes:
      - ./config/searxng:/etc/searxng:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  geekcubo-data:
